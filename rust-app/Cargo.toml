[package]
name = "coursera-rust-translator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rodio = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.4", features = ["v4"] }
anyhow = "1.0"
urlencoding = "2.1"
futures-util = "0.3"
tray-item = "0.10.0"

[build-dependencies]
winres = "0.1.12"
